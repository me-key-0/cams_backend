  #   ports:
  #     - "3310:3306"
  #   networks:
  #     - micro-net

  resource-db:
    image: mariadb:11
    container_name: resource-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $904380
      MYSQL_DATABASE: resource_db
    ports:
