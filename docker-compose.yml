services:
  service-discovery:
    build: ./service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    networks:
      - micro-net

  auth-db:
    image: mariadb:11
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $904380
      MYSQL_DATABASE: auth_dbcd 
    ports:
      - "3307:3306"
    networks:
      - micro-net

  user-db:
    image: mariadb:11
    container_name: user-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $904380
      MYSQL_DATABASE: user_db
    ports:
      - "3308:3306"
    networks:
      - micro-net

  course-db:
    image: mariadb:11
    container_name: course-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $904380
      MYSQL_DATABASE: course_db
    ports:
      - "3309:3306"
    networks:
      - micro-net

  # grade-db:
  #   image: mariadb:11
  #   container_name: grade-db
  #   restart: always
  #   environment:
