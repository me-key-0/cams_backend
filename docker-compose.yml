  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8760:8760"
    depends_on:
      - service-discovery
    networks:
      - micro-net

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8763:8763"
    depends_on:
      - service-discovery
    networks:
      - micro-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8762:8762"
    depends_on:
      - service-discovery
    networks:
      - micro-net

  course-service:
    build: ./course-service
    container_name: course-service
    ports:
      - "8764:8764"
    depends_on:
      - service-discovery
    networks:
      - micro-net

  resource-service:
    build: ./resource-service
    container_name: resource-service
    ports:
      - "8767:8767"
    depends_on:
      - service-discovery
    networks:
      - micro-net

  # communication-service:
